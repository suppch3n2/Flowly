<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Datenschutz: nur eigene Dateien; einzige Ausnahme: öffentliche Coin-Kurse/-Bilder von CoinGecko -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://coin-images.coingecko.com https://assets.coingecko.com; font-src 'self'; connect-src 'self' https://api.coingecko.com; manifest-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Flowly</title>
  <meta name="description" content="Flowly – deine Finanzen im Fluss. Einnahmen, Ausgaben, Budgets und Sparziele, lokal auf deinem iPhone.">
  <meta name="theme-color" content="#090B10">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flowly">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <button type="button" class="avatar" id="avatar" data-action="tab" data-tab="settings" aria-label="Einstellungen"></button>
      <nav class="pills" id="pills" aria-label="Bereiche"></nav>
    </header>

    <div class="ptr" id="ptr" aria-hidden="true"><div class="ptr-inner"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="6.9" transform="rotate(0 12 12)" data-o="1"/><line x1="12" y1="3" x2="12" y2="6.9" transform="rotate(45 12 12)" data-o="0.85"/><line x1="12" y1="3" x2="12" y2="6.9" transform="rotate(90 12 12)" data-o="0.7"/><line x1="12" y1="3" x2="12" y2="6.9" transform="rotate(135 12 12)" data-o="0.58"/><line x1="12" y1="3" x2="12" y2="6.9" transform="rotate(180 12 12)" data-o="0.47"/><line x1="12" y1="3" x2="12" y2="6.9" transform="rotate(225 12 12)" data-o="0.38"/><line x1="12" y1="3" x2="12" y2="6.9" transform="rotate(270 12 12)" data-o="0.3"/><line x1="12" y1="3" x2="12" y2="6.9" transform="rotate(315 12 12)" data-o="0.24"/></svg></div></div>
    <span class="sr-only" id="ptr-status" role="status" aria-live="polite"></span>

    <main class="views">
      <section class="view" id="view-start" data-view="start" aria-label="Start"></section>
      <section class="view" id="view-coins" data-view="coins" aria-label="Coins"></section>
      <section class="view" id="view-numbers" data-view="numbers" aria-label="Zahlen"></section>
      <section class="view" id="view-budgets" data-view="budgets" aria-label="Budgets"></section>
      <section class="view" id="view-goals" data-view="goals" aria-label="Sparziele"></section>
      <section class="view" id="view-settings" data-view="settings" aria-label="Einstellungen"></section>
    </main>

    <noscript><p class="noscript">Flowly braucht JavaScript.</p></noscript>
  </div>

  <div class="tabbar bottombar" id="tabbar">
    <label class="search-pill" id="search-pill">
      <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr-only">Umsätze durchsuchen</span>
      <input type="search" id="global-search" placeholder="Umsätze durchsuchen" autocomplete="off" enterkeyhint="search">
      <button type="button" class="search-clear" id="search-clear" aria-label="Suche leeren"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </label>
    <button type="button" class="fab" data-action="open-add" aria-label="Buchung hinzufügen"><svg class="ico" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div id="overlay-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".csv,.txt,text/csv,text/plain,text/comma-separated-values" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
